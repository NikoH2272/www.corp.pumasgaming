<style>
/* ── TORNEO INDIVIDUAL · paleta #003772 / #ffc659 / #24d6a5 ──── */
body { background: var(--bg-a); }

.trn-hero {
  position: relative; overflow: hidden;
  min-height: 220px; display: flex; flex-direction: column;
  align-items: center; justify-content: flex-end;
  padding: 0 1.5rem 2rem;
  background: linear-gradient(180deg, var(--trn-hero-from, #003772) 0%, var(--trn-hero-mid, #002060) 55%, var(--bg-a, #011a3a) 100%);
}
.trn-hero-banner {
  position: absolute; inset: 0; z-index: 0;
  background-size: cover; background-position: center;
  filter: brightness(.45) saturate(1.3);
}
.trn-hero-content { position: relative; z-index: 1; text-align: center; width: 100%; max-width: 750px; }
.trn-logo {
  width: 72px; height: 72px; border-radius: 50%;
  border: 3px solid var(--primary); overflow: hidden;
  background: var(--trn-hero-from, #003772); margin: 0 auto .8rem;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 20px rgba(var(--primary-rgb, 0,238,255),.3);
}
.trn-logo img { width: 100%; height: 100%; object-fit: cover; }
.trn-logo-ico { font-size: 2rem; color: var(--primary); opacity: .8; }
.trn-titulo { font-family: 'Michroma', sans-serif; font-size: clamp(1.3rem,5vw,2rem); color: var(--primary); margin: 0 0 .35rem; text-shadow: 0 2px 12px rgba(var(--primary-rgb, 0,238,255),.35), 0 0 30px rgba(var(--primary-rgb, 0,238,255),.15); }
.trn-sub { color: var(--gray); font-size: .82rem; display: flex; gap: .9rem; justify-content: center; flex-wrap: wrap; margin: 0; }
.trn-sub span { display: flex; align-items: center; gap: .3rem; }
.trn-sub i { color: var(--t4); }
.trn-estado {
  display: inline-block; font-size: .7rem; font-weight: 700; letter-spacing: .07em;
  text-transform: uppercase; padding: .25rem .65rem; border-radius: 20px; margin-top: .6rem;
}
.estado-en_curso     { background: rgba(36,214,165,.15); color: #24d6a5; border: 1px solid rgba(36,214,165,.45); }
.estado-inscripciones{ background: rgba(255,198,89,.15); color: #ffc659; border: 1px solid rgba(255,198,89,.5); }
.estado-finalizado   { background: rgba(0,132,133,.15);  color: #008485; border: 1px solid rgba(0,132,133,.4); }
.estado-borrador     { background: rgba(0,26,68,.5);     color: var(--gray); border: 1px solid rgba(0,132,133,.2); }

/* tabs */
.trn-tabs { display: flex; border-bottom: 2px solid var(--line); background: var(--trn-hero-mid, #002255); position: sticky; top: 0; z-index: 20; }
.trn-tab  { flex: 1; padding: .85rem .5rem; text-align: center; font-size: .82rem; font-weight: 600; cursor: pointer; color: var(--gray); border-bottom: 2px solid transparent; margin-bottom: -2px; transition: color .15s, border-color .15s; }
.trn-tab:hover  { color: var(--light); }
.trn-tab.activa { color: var(--primary); border-bottom-color: var(--primary); }

/* paneles */
.trn-panel { display: none; max-width: 900px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
.trn-panel.activo { display: block; }

/* tabla de posiciones */
.trn-tabla { width: 100%; border-collapse: collapse; font-size: .85rem; }
.trn-tabla thead th { text-align: left; padding: .5rem .6rem; color: var(--t4); font-size: .7rem; letter-spacing: .09em; text-transform: uppercase; border-bottom: 1px solid var(--line); }
.trn-tabla tbody tr { border-bottom: 1px solid var(--line); transition: background .12s; }
.trn-tabla tbody tr:hover { background: rgba(var(--primary-rgb, 0,55,114),.12); }
.trn-tabla td { padding: .65rem .6rem; vertical-align: middle; }
.trn-rank { font-family: 'Michroma', sans-serif; font-size: .8rem; color: var(--gray); width: 2rem; text-align: center; }
.trn-rank.top1 { color: #ffc659; }
.trn-rank.top2 { color: #ebe070; }
.trn-rank.top3 { color: #24d6a5; }
.trn-nombre { font-weight: 700; color: var(--light); }
.trn-ig     { font-size: .75rem; color: var(--gray); }
.trn-pts    { font-family: 'Michroma', sans-serif; color: var(--primary); font-size: .95rem; font-weight: 700; text-align: right; }
.trn-kills  { color: var(--accent); text-align: right; font-size: .88rem; }

/* resultados por ronda */
.trn-ronda-titulo {
  font-family: 'Michroma', sans-serif; font-size: .78rem; letter-spacing: .1em;
  text-transform: uppercase; color: var(--t4); padding: 1.2rem 0 .5rem;
  border-bottom: 1px solid var(--line); margin: 0 0 .6rem;
}
.trn-partida-card {
  background: rgba(255,255,255,.025);
  backdrop-filter: blur(14px) saturate(1.3);
  -webkit-backdrop-filter: blur(14px) saturate(1.3);
  border: 1px solid rgba(var(--primary-rgb, 0,238,255),.18);
  border-radius: 6px; padding: .9rem 1rem; margin-bottom: .8rem;
  box-shadow: 0 2px 24px rgba(0,0,0,.45), inset 0 1px 0 rgba(var(--primary-rgb,0,238,255),.07);
}
.trn-partida-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: .6rem; font-size: .78rem; color: var(--gray); }
.trn-res-tabla { width: 100%; font-size: .8rem; border-collapse: collapse; }
.trn-res-tabla th { text-align: left; color: var(--t4); font-size: .69rem; letter-spacing: .06em; text-transform: uppercase; padding: .25rem .4rem; border-bottom: 1px solid var(--line); }
.trn-res-tabla td { padding: .35rem .4rem; border-bottom: 1px solid rgba(0,132,133,.15); }
.trn-res-tabla .pos1 { color: #ffc659; font-weight: 700; }
.trn-res-tabla .pos2 { color: #ebe070; }
.trn-res-tabla .pos3 { color: #24d6a5; }

/* equipos */
.trn-equipo-card {
  display: flex; align-items: center; gap: .8rem;
  background: var(--trn-card-bg, linear-gradient(175deg, #002a60 0%, #001e48 100%));
  border: 1.5px solid rgba(var(--primary-rgb, 0,132,133),.2);
  border-radius: 10px; padding: .75rem 1rem; margin-bottom: .5rem;
  transition: border-color .15s;
}
.trn-equipo-card:hover { border-color: rgba(var(--primary-rgb, 255,198,89),.4); }
.trn-equipo-seed { font-family: 'Michroma', sans-serif; font-size: .75rem; color: var(--t4); min-width: 1.5rem; }
.trn-equipo-nombre { font-weight: 700; font-size: .9rem; color: var(--light); }
.trn-equipo-ig     { font-size: .75rem; color: var(--gray); }
.trn-eliminado     { opacity: .4; text-decoration: line-through; }

/* descripción */
.trn-desc { color: var(--gray); line-height: 1.7; font-size: .88rem; white-space: pre-wrap; }
.tz-b { font-size: .64rem; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); border-radius: 4px; padding: 1px 6px; white-space: nowrap; font-family: 'Michroma', sans-serif; }
.tz-b b { color: var(--primary, #00eeff); font-weight: 700; margin-right: 3px; }
.tz-b small { opacity: .7; font-size: .6rem; }

/* back link */
.trn-back { display: inline-flex; align-items: center; gap: .4rem; color: var(--t4); font-size: .8rem; text-decoration: none; padding: .8rem 1rem; transition: color .15s; }
.trn-back:hover { color: var(--primary); }

/* vacío / carga */
.trn-vacio   { text-align: center; color: var(--gray); padding: 2.5rem 0; font-size: .88rem; }
.trn-spinner { display: flex; align-items: center; justify-content: center; gap: .6rem; color: var(--t4); font-size: .85rem; padding: 3rem 0; }
.trn-spinner i { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── hero pulse ──────────────────────────────────────────────── */
.trn-hero::after {
  content:''; position:absolute; inset:0; z-index:0; pointer-events:none;
  background: radial-gradient(ellipse 70% 60% at 50% 100%, rgba(var(--primary-rgb,0,238,255),.22) 0%, transparent 65%);
  animation: heroGlow 5s ease-in-out infinite;
}
@keyframes heroGlow { 0%,100%{opacity:.45} 50%{opacity:1} }

/* ── tab glow ────────────────────────────────────────────────── */
.trn-tab.activa { color:var(--primary); border-bottom-color:var(--primary); text-shadow:0 0 10px rgba(var(--primary-rgb,0,238,255),.5), 0 0 24px rgba(var(--primary-rgb,0,238,255),.2); }

/* ── rank glow ───────────────────────────────────────────────── */
.trn-rank.top1 { color:#ffc659; text-shadow:0 0 8px rgba(255,198,89,.55); }
.trn-rank.top2 { color:#d4cf60; text-shadow:0 0 6px rgba(212,207,96,.4); }
.trn-rank.top3 { color:#24d6a5; text-shadow:0 0 6px rgba(36,214,165,.4); }

/* ── info two-col ────────────────────────────────────────────── */
.trn-info-layout { display:grid; grid-template-columns:1fr 170px; gap:1.5rem; align-items:start; }
@media(max-width:560px) { .trn-info-layout { grid-template-columns:1fr; } .trn-info-banner-col { order:-1; } }
.trn-info-banner-col img { width:100%; border-radius:6px; box-shadow:0 8px 36px rgba(0,0,0,.65); border:1px solid rgba(var(--primary-rgb,0,238,255),.15); }

/* ── grupos ──────────────────────────────────────────────────── */
.trn-grupo-count { font-size:.72rem; color:var(--gray); display:flex; gap:.5rem; align-items:center; margin-bottom:1.2rem; }

/* ── sponsors ────────────────────────────────────────────────── */
#seccion-sponsors { border-top:1px solid var(--line); }
.trn-sponsors-wrap { max-width:900px; margin:0 auto; padding:1.5rem 1rem 2.5rem; text-align:center; }
.trn-sponsors-titulo { font-family:'Michroma',sans-serif; font-size:.68rem; letter-spacing:.14em; text-transform:uppercase; color:var(--t4); margin-bottom:1.2rem; }
.trn-sponsors-lista { display:flex; flex-wrap:wrap; gap:1.4rem; justify-content:center; align-items:center; }
.trn-sponsor-item { display:flex; flex-direction:column; align-items:center; gap:.35rem; text-decoration:none; color:var(--gray); font-size:.72rem; opacity:.6; transition:opacity .18s; }
.trn-sponsor-item:hover { opacity:1; }
.trn-sponsor-logo { height:44px; width:auto; max-width:120px; object-fit:contain; filter:grayscale(.5) brightness(1.1); transition:filter .18s; }
.trn-sponsor-item:hover .trn-sponsor-logo { filter:none; }

/* ── mobile ──────────────────────────────────────────────────── */
@media(max-width:500px) {
  .trn-tabs { overflow-x:auto; scrollbar-width:none; -ms-overflow-style:none; }
  .trn-tabs::-webkit-scrollbar { display:none; }
  .trn-tab { flex:0 0 auto; min-width:75px; font-size:.76rem; padding:.72rem .45rem; }
  .trn-panel { padding:1rem .75rem 2.5rem; }
}
</style>

<script>
(function () {
  const P = window.PumasPortal;
  let TORNEO = null;
  let TABLA  = [];

  const ESTADOS = {
    en_curso:      { label: 'En curso',           cls: 'estado-en_curso' },
    inscripciones: { label: 'Inscripciones abiertas', cls: 'estado-inscripciones' },
    finalizado:    { label: 'Finalizado',          cls: 'estado-finalizado' },
    borrador:      { label: 'Borrador',            cls: 'estado-borrador' }
  };
  const JUEGOS = { free_fire:'Free Fire', cod:'Call of Duty', valorant:'Valorant', fortnite:'Fortnite', minecraft:'Minecraft' };

  function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function fmtFecha(iso) { if (!iso) return null; return new Date(iso).toLocaleDateString('es',{day:'2-digit',month:'short',year:'numeric',timeZone:'America/Bogota'}); }
  function fmtHoraCOL(iso){if(!iso)return '';const d=new Date(iso);return d.toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'America/Bogota'});}
  function fmtZonasBadges(iso){
    if(!iso)return '';
    const d=new Date(iso);if(isNaN(d))return '';
    const t=tz=>d.toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:tz});
    const fd=tz=>d.toLocaleDateString('es',{day:'2-digit',month:'short',timeZone:tz});
    const dCol=fd('America/Bogota'),dMex=fd('America/Mexico_City'),dArg=fd('America/Argentina/Buenos_Aires');
    const sMex=dMex!==dCol?`<small> ${dMex}</small>`:'',sArg=dArg!==dCol?`<small> ${dArg}</small>`:'';
    return `<span class="tz-b"><b>COL</b>${t('America/Bogota')}</span>`+
           `<span class="tz-b"><b>MEX</b>${t('America/Mexico_City')}${sMex}</span>`+
           `<span class="tz-b"><b>ARG</b>${t('America/Argentina/Buenos_Aires')}${sArg}</span>`;
  }

  /* ── Aplicar colores del torneo ────────────────────────────── */
  function aplicarColores(colores) {
    if (!colores) return;
    const b = document.body;
    if (colores.primary) {
      b.style.setProperty('--primary',     colores.primary);
      b.style.setProperty('--primary-rgb', hexRgb(colores.primary));
      b.style.setProperty('--line', `rgba(${hexRgb(colores.primary)},.25)`);
    }
    if (colores.accent) {
      b.style.setProperty('--accent',      colores.accent);
      b.style.setProperty('--accent-rgb',  hexRgb(colores.accent));
      b.style.setProperty('--light',       colores.accent);
    }
    if (colores.bg) {
      b.style.setProperty('--bg-a',         colores.bg);
      b.style.setProperty('--bg-b',         darken(colores.bg, 8));
      b.style.setProperty('--trn-hero-from', darken(colores.bg, 18));
      b.style.setProperty('--trn-hero-mid',  darken(colores.bg, 10));
      b.style.setProperty('--trn-card-bg',   darken(colores.bg, 8));
    }
  }
  // Lightens (+) or darkens (-) an hex color by `amt` (0-255)
  function darken(hex, amt) {
    let r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), bv=parseInt(hex.slice(5,7),16);
    r=Math.min(255,Math.max(0,r+amt)); g=Math.min(255,Math.max(0,g+amt)); bv=Math.min(255,Math.max(0,bv+amt));
    return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${bv.toString(16).padStart(2,'0')}`;
  }
  function hexRgb(hex) {
    const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
    return isNaN(r)?'255,198,89':`${r},${g},${b}`;
  }

  /* ── Tabs ─────────────────────────────────────────────────── */
  function abrirTab(nombre) {
    document.querySelectorAll('.trn-tab').forEach(t => t.classList.toggle('activa', t.dataset.tab === nombre));
    document.querySelectorAll('.trn-panel').forEach(p => p.classList.toggle('activo', p.id === 'panel-' + nombre));
    if (nombre === 'resultados' && !document.getElementById('contenido-resultados').dataset.cargado) cargarResultados();
    if (nombre === 'grupos'     && !document.getElementById('contenido-grupos').dataset.cargado)     cargarGrupos();
  }
  window.abrirTab = abrirTab;

  /* ── GRUPOS ───────────────────────────────────────────────── */
  function cargarGrupos() {
    const el = document.getElementById('contenido-grupos');
    el.dataset.cargado = '1';
    const byGroup = {};
    const ordered = [];
    TABLA.forEach(e => {
      const g = e.grupo || 'Sin grupo asignado';
      if (!byGroup[g]) { byGroup[g] = []; ordered.push(g); }
      byGroup[g].push(e);
    });
    if (!ordered.length) {
      el.innerHTML = '<div class="trn-vacio"><i class="fa-solid fa-users-slash"></i> No hay equipos inscritos aún.</div>';
      return;
    }
    const cfg = TORNEO?.config || {};
    const total = TABLA.length;
    const max   = cfg.max_equipos;
    let html = `<div class="trn-grupo-count"><i class="fa-solid fa-users" style="color:var(--primary)"></i> <strong style="color:var(--primary)">${total}</strong> equipo${total!==1?'s':''} inscritos${max?' · cupo '+max:''}</div>`;
    for (const grupo of ordered) {
      const equipos = byGroup[grupo];
      html += `<div class="trn-ronda-titulo">${esc(grupo)}</div>`;
      html += equipos.map((e,i) => `
        <div class="trn-equipo-card">
          <div class="trn-equipo-seed">#${i+1}</div>
          <div>
            <div class="trn-equipo-nombre">${esc(e.nombre)}</div>
            ${e.ig?`<div class="trn-equipo-ig">@${esc(e.ig)}</div>`:''}
          </div>
        </div>`).join('');
    }
    el.innerHTML = html;
  }

  /* ── helpers para resultados DFS-style ──────────────────────── */
  const _rTotal = f => (parseInt(f.kills)||0)+(parseInt(f.pp)||0)-(parseInt(f.sancion)||0);
  const _rSort  = arr => [...arr].sort((a,b)=>_rTotal(b)-_rTotal(a)||(b.pp||0)-(a.pp||0)||(b.kills||0)-(a.kills||0));

  /* ── RESULTADOS POR FASE/GRUPO ───────────────────────────────── */
  async function cargarResultados() {
    const el = document.getElementById('contenido-resultados');
    el.dataset.cargado = '1';
    const rd = TORNEO?.config?.resultados;
    if (!rd?.grupos?.length) {
      el.innerHTML = '<div class="trn-vacio"><i class="fa-solid fa-ghost"></i> Sin resultados registrados aún.</div>';
      return;
    }
    const fases = rd.fases || [...new Set(rd.grupos.map(g=>g.fase))];
    let html = '';
    for (const fase of fases) {
      const grupos = rd.grupos.filter(g=>g.fase===fase);
      if (!grupos.length) continue;
      html += `<div class="trn-ronda-titulo">${esc(fase)}</div>`;
      for (const g of grupos) {
        const filas = _rSort((g.filas||[]).filter(f=>f.equipo?.trim()));
        const clasifican = parseInt(g.clasifican)||0;
        if (!filas.length) continue;
        html += `<div class="trn-partida-card">
          <div class="trn-partida-head">
            <span style="font-weight:600">${esc(g.titulo)}</span>
            ${clasifican?`<span style="color:var(--primary);font-size:.75rem">Clasifican ${clasifican}</span>`:''}
          </div>
          <table class="trn-res-tabla">
            <thead><tr><th>#</th><th>Equipo</th><th style="text-align:right">Kills</th><th style="text-align:right">P.P</th><th style="text-align:right">Sanc.</th><th style="text-align:right">Total</th></tr></thead>
            <tbody>${filas.map((f,i)=>`<tr>
              <td class="${i===0?'pos1':i===1?'pos2':i===2?'pos3':''}">${i+1}</td>
              <td style="font-weight:${i<clasifican?'700':'400'}">${esc(f.equipo)}${i<clasifican&&clasifican?' <small style="color:var(--primary);font-size:.65rem">→</small>':''}</td>
              <td style="text-align:right">${f.kills||0}</td>
              <td style="text-align:right;color:var(--primary)">${f.pp||0}</td>
              <td style="text-align:right;color:var(--t4)">${f.sancion||0}</td>
              <td style="text-align:right;font-weight:700;color:var(--primary)">${_rTotal(f)}</td>
            </tr>`).join('')}</tbody>
          </table>
        </div>`;
      }
    }
    el.innerHTML = html || '<div class="trn-vacio"><i class="fa-solid fa-ghost"></i> Sin resultados aún.</div>';
  }

  /* ── INFO ─────────────────────────────────────────────────── */
  function renderInfo() {
    const t = TORNEO;
    const c = t.config || {};
    let rows = [];
    if (t.juego)           rows.push(['Juego',        JUEGOS[t.juego]||t.juego]);
    if (c.fecha_texto)     rows.push(['Inicio aprox.',c.fecha_texto]);
    if (c.formato_equipos) rows.push(['Formato',      `Grupos de ${c.formato_equipos} equipos`]);
    else if (c.formato)    rows.push(['Formato',      c.formato]);
    if (c.max_equipos)     rows.push(['Cupos',        c.max_equipos]);
    if (c.premio)          rows.push(['Premio 🏆',    c.premio]);

    const tabla = rows.length ? `<table style="width:100%;border-collapse:collapse;font-size:.85rem;margin-bottom:1.2rem">
      ${rows.map(([k,v]) => `<tr style="border-bottom:1px solid var(--line)">
        <td style="padding:.5rem .6rem;color:var(--gray);width:38%">${esc(k)}</td>
        <td style="padding:.5rem .6rem;color:var(--light,#e8e0d0);font-weight:600">${esc(String(v))}</td>
      </tr>`).join('')}
    </table>` : '';

    // Cronograma
    let crono = '';
    if (Array.isArray(c.cronograma) && c.cronograma.length) {
      crono = `<div style="margin-bottom:1.2rem">
        <div style="font:.7rem 'Michroma',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--primary,#D8C395);margin-bottom:.6rem">
          <i class="fa-regular fa-calendar-days" style="margin-right:.4rem"></i>Cronograma
        </div>
        ${c.cronograma.map(g=>`
          <div style="border:1px solid var(--line);border-radius:10px;padding:.65rem .85rem;margin-bottom:.4rem;background:rgba(255,255,255,.025);backdrop-filter:blur(8px)">
            <div style="font:.72rem 'Michroma',sans-serif;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--light,#e8e0d0);margin-bottom:${g.fecha?'5px':'0'}">
              ${esc(g.grupo||'Grupo')}
            </div>
            ${g.fecha?`
              <div style="font-size:.82rem;color:var(--gray);margin-bottom:3px">
                <i class="fa-regular fa-clock" style="margin-right:4px;color:var(--primary)"></i>
                ${fmtFecha(g.fecha)} · ${fmtHoraCOL(g.fecha)} COL
              </div>
              <div style="display:flex;gap:.3rem;flex-wrap:wrap">${fmtZonasBadges(g.fecha)}</div>
            `:'<div style="font-size:.76rem;color:var(--gray)">Fecha por confirmar</div>'}
          </div>`).join('')}
      </div>`;
    }

    // Reglamento button
    const regBtn = c.reglamento_url ? `<div style="margin-bottom:1.2rem">
      <button onclick="window.open('${esc(c.reglamento_url)}','_blank')" style="background:rgba(var(--primary-rgb,255,198,89),.1);border:1px solid rgba(var(--primary-rgb,255,198,89),.35);color:var(--primary);padding:.45rem 1rem;border-radius:8px;font-size:.8rem;cursor:pointer;display:inline-flex;align-items:center;gap:.45rem">
        <i class="fa-solid fa-scroll"></i> Ver reglamento
      </button>
    </div>` : '';

    const desc = t.descripcion ? `<div class="trn-desc">${esc(t.descripcion)}</div>` : '';
    const main = tabla + crono + regBtn + desc;

    // Banner vertical
    const bv = c.banner_vertical;
    if (bv) {
      document.getElementById('contenido-info').innerHTML = `
        <div class="trn-info-layout">
          <div>${main}</div>
          <div class="trn-info-banner-col"><img src="${esc(bv)}" alt="Banner"></div>
        </div>`;
    } else {
      document.getElementById('contenido-info').innerHTML = main || '<div class="trn-vacio"><i class="fa-solid fa-circle-info"></i> Sin información adicional.</div>';
    }
  }

  /* ── SPONSORS ─────────────────────────────────────────────── */
  function cargarSponsors() {
    const sponsors = TORNEO?.config?.sponsors;
    if (!sponsors?.length) return;
    const sec   = document.getElementById('seccion-sponsors');
    const lista = document.getElementById('sponsors-lista');
    if (!sec || !lista) return;
    lista.innerHTML = sponsors.map(s => {
      const tag  = s.link_url ? `a href="${esc(s.link_url)}" target="_blank" rel="noopener"` : 'div';
      const etag = s.link_url ? 'a' : 'div';
      return `<${tag} class="trn-sponsor-item">
        ${s.logo_url ? `<img src="${esc(s.logo_url)}" alt="${esc(s.nombre||'')}" class="trn-sponsor-logo">` : ''}
        ${s.nombre   ? `<span>${esc(s.nombre)}</span>` : ''}
      </${etag}>`;
    }).join('');
    sec.style.display = '';
  }

  /* ── INIT ─────────────────────────────────────────────────── */
  async function init() {
    const params = new URLSearchParams(location.search);
    const id     = params.get('id');
    if (!id || isNaN(Number(id))) { mostrarError('ID de torneo no válido.'); return; }

    try {
      // Cargar torneo: buscamos en la lista pública (no hay endpoint de uno solo)
      const lista = await P.torneos.publico(null);
      TORNEO = Array.isArray(lista) ? lista.find(t => String(t.id) === String(id)) : null;
      if (!TORNEO) { mostrarError('Torneo no encontrado o no está disponible.'); return; }

      // Título dinámico
      document.title = `${TORNEO.nombre} · Pumas Gaming`;

      // Colores
      aplicarColores(TORNEO.colores);

      // Hero
      document.getElementById('trn-titulo').textContent = TORNEO.nombre;
      if (TORNEO.banner_url) document.getElementById('trn-banner').style.backgroundImage = `url(${TORNEO.banner_url})`;
      if (TORNEO.logo_url) {
        document.getElementById('trn-logo').innerHTML = `<img src="${esc(TORNEO.logo_url)}" alt="">`;
        document.getElementById('page-icon').href     = TORNEO.logo_url;
        document.getElementById('header-logo').src    = TORNEO.logo_url;
      }
      document.getElementById('header-nombre').textContent = TORNEO.nombre.toUpperCase().slice(0,14);

      // Sub línea del hero
      const sub = [];
      const juego = JUEGOS[TORNEO.juego] || TORNEO.juego;
      if (juego) sub.push(`<span><i class="fa-solid fa-gamepad"></i>${esc(juego)}</span>`);
      const fechaTxt = TORNEO.config?.fecha_texto;
      if (fechaTxt) sub.push(`<span><i class="fa-regular fa-calendar"></i>${esc(fechaTxt)}</span>`);
      if (TORNEO.portal && P.PORTALES[TORNEO.portal]) {
        sub.push(`<span><i class="fa-solid fa-link"></i>${esc(P.PORTALES[TORNEO.portal].nombre)}</span>`);
      }
      document.getElementById('trn-sub').innerHTML = sub.join('');

      // Estado chip
      const est = ESTADOS[TORNEO.estado] || { label: TORNEO.estado, cls: 'estado-borrador' };
      const chip = document.getElementById('trn-estado-chip');
      chip.textContent = est.label;
      chip.className   = `trn-estado ${est.cls}`;

      // Equipos (para panel grupos)
      const tablaData = await P.torneos.tabla(Number(id));
      TABLA = Array.isArray(tablaData) ? tablaData : [];

      // Info (tab por defecto)
      renderInfo();

      // Sponsors
      cargarSponsors();

      // Mostrar contenido
      document.getElementById('main-cargando').style.display  = 'none';
      document.getElementById('main-contenido').style.display = '';

    } catch(e) {
      mostrarError('Error al cargar el torneo. Intenta de nuevo.');
    }
  }

  function mostrarError(msg) {
    document.getElementById('main-cargando').style.display = 'none';
    document.getElementById('main-error').style.display    = '';
    document.getElementById('error-msg').textContent       = msg;
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
</html>
