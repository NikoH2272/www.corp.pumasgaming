<style>
:root{--cp-gold:#D8C395;--cp-gold2:#F4EEDC;--cp-gold-a:#B8A875;--cp-dark:#0A0A0A;--cp-dark2:#141414;--cp-dark3:#1E1E1E;--cp-dark4:#282828;--cp-ln:rgba(216,195,149,.18);--cp-tx:#F4EEDC;--cp-gray:#7A7060}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--cp-dark);color:var(--cp-tx);font:15px/1.5 'Segoe UI',sans-serif;min-height:100dvh}
a{color:inherit;text-decoration:none}
.pg-nav{display:flex;align-items:center;gap:1rem;padding:.85rem 1.5rem;background:rgba(10,10,10,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--cp-ln);position:sticky;top:0;z-index:50;flex-wrap:wrap}
.pg-logo{display:flex;align-items:center;gap:.6rem;font-family:'Michroma',sans-serif;font-size:.82rem;letter-spacing:.1em;text-transform:uppercase;color:var(--cp-gold)}
.pg-logo img{width:36px}
.pg-nav-links{display:flex;gap:.5rem;margin-left:auto;flex-wrap:wrap}
.pg-nav-links a{font-family:'Michroma',sans-serif;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--cp-gray);padding:.3rem .6rem;border-radius:4px;transition:color .15s}
.pg-nav-links a:hover,.pg-nav-links a.on{color:var(--cp-gold)}
.pg-hero{padding:4rem 1.5rem 2.5rem;text-align:center;background:linear-gradient(180deg,rgba(216,195,149,.04) 0%,transparent 100%)}
.pg-hero h1{font-family:'Michroma',sans-serif;font-size:clamp(1.5rem,4vw,2.5rem);letter-spacing:.1em;text-transform:uppercase;color:var(--cp-gold);display:flex;align-items:center;justify-content:center;gap:.5rem}
.pg-hero p{color:var(--cp-gray);margin-top:.5rem;font-size:.95rem}
.pg-wrap{max-width:1100px;margin:0 auto;padding:0 1.2rem 3rem}

/* ── LISTA RELAMPAGOS ── */
.rmp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1.2rem;margin:2rem 0}
.rmp-card{background:var(--cp-dark2);border:1px solid var(--cp-ln);border-radius:10px;overflow:hidden;transition:transform .18s,border-color .18s;cursor:pointer;display:flex;flex-direction:column}
.rmp-card:hover{transform:translateY(-3px);border-color:rgba(216,195,149,.4)}
.rmp-banner{width:100%;height:120px;object-fit:cover;background:var(--cp-dark3);display:flex;align-items:center;justify-content:center;color:var(--cp-gray);font-size:.75rem}
.rmp-banner img{width:100%;height:100%;object-fit:cover}
.rmp-body{padding:1rem;flex:1;display:flex;flex-direction:column;gap:.4rem}
.rmp-row{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.rmp-nombre{font-family:'Michroma',sans-serif;font-size:.95rem;letter-spacing:.06em;color:var(--cp-gold);flex:1}
.rmp-juego{font-size:.72rem;color:var(--cp-gray)}
.rmp-meta{display:flex;flex-wrap:wrap;gap:.5rem;font-size:.78rem;color:var(--cp-gray);margin-top:.2rem}
.rmp-meta i{color:var(--cp-gold-a);width:14px;text-align:center}
.rmp-prize{font-weight:700;color:var(--cp-gold);font-family:'Michroma',sans-serif;font-size:.82rem;margin-top:auto;padding-top:.5rem}
.rmp-footer{display:flex;align-items:center;justify-content:space-between;padding:.75rem 1rem;border-top:1px solid var(--cp-ln);background:rgba(0,0,0,.15)}
.chip{display:inline-block;padding:.15rem .55rem;border-radius:20px;font:.65rem 'Michroma',sans-serif;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.chip-activo   {background:rgba(110,231,168,.12);color:#6ee7a8;border:1px solid rgba(110,231,168,.3)}
.chip-en_juego {background:rgba(255,198,89,.12); color:#FFD54A;border:1px solid rgba(255,198,89,.3)}
.chip-finalizado{background:rgba(216,195,149,.1);color:var(--cp-gold);border:1px solid rgba(216,195,149,.25)}
.chip-gratis   {background:rgba(110,231,168,.1); color:#6ee7a8;border:1px solid rgba(110,231,168,.3)}
.chip-pago     {background:rgba(216,195,149,.1); color:var(--cp-gold);border:1px solid rgba(216,195,149,.25)}

/* ── DETALLE ── */
.rmp-detalle{display:none;animation:fadeUp .25s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.det-back{display:flex;align-items:center;gap:.5rem;font:700 .78rem 'Michroma',sans-serif;letter-spacing:.07em;text-transform:uppercase;color:var(--cp-gray);cursor:pointer;margin-bottom:1.5rem;padding:.4rem .6rem;border-radius:4px;width:fit-content}
.det-back:hover{color:var(--cp-gold)}
.det-hero{border:1px solid var(--cp-ln);border-radius:10px;overflow:hidden;background:var(--cp-dark2);margin-bottom:1.5rem}
.det-banner{width:100%;max-height:280px;object-fit:cover;display:block;background:var(--cp-dark3)}
.det-info{padding:1.4rem 1.5rem}
.det-title{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;margin-bottom:.7rem}
.det-title h2{font-family:'Michroma',sans-serif;font-size:clamp(1.1rem,3vw,1.6rem);color:var(--cp-gold)}
.det-logo{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid var(--cp-ln);background:var(--cp-dark3)}
.det-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.7rem;margin:.8rem 0}
.det-dato{background:var(--cp-dark3);border:1px solid var(--cp-ln);border-radius:6px;padding:.6rem .9rem}
.det-dato label{display:block;font:700 .62rem 'Michroma',sans-serif;letter-spacing:.08em;color:var(--cp-gold);text-transform:uppercase;margin-bottom:2px}
.det-dato span{font-size:.88rem}
.tz-row{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:4px}
.tz-tag{font-size:.68rem;background:rgba(216,195,149,.08);border:1px solid rgba(216,195,149,.18);border-radius:4px;padding:1px 6px;white-space:nowrap;font-family:'Michroma',sans-serif}
.tz-tag b{color:var(--cp-gold);font-weight:700;margin-right:3px}
.det-desc{color:var(--cp-gray);font-size:.9rem;line-height:1.6;margin-top:.6rem}
.det-contacto{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:1rem}
.det-contacto a{display:flex;align-items:center;gap:.4rem;font:700 .72rem 'Michroma',sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:.4rem .85rem;border:1.5px solid var(--cp-ln);border-radius:5px;color:var(--cp-tx);transition:all .15s}
.det-contacto a:hover{border-color:var(--cp-gold);color:var(--cp-gold)}
.det-contacto a i{width:16px;text-align:center}

/* ── RESULTADOS ── */
.res-section{margin-top:1.5rem}
.res-title{font-family:'Michroma',sans-serif;font-size:.82rem;letter-spacing:.1em;text-transform:uppercase;color:var(--cp-gold);margin-bottom:1rem;display:flex;align-items:center;gap:.5rem}

/* PODIO */
.podio{display:flex;align-items:flex-end;justify-content:center;gap:0;margin:0 auto 1.5rem;max-width:460px;height:160px}
.pod-step{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;flex:1;padding:.6rem .3rem .5rem;position:relative;border:1px solid var(--cp-ln)}
.pod-step.p1{height:100%;background:linear-gradient(180deg,rgba(255,213,74,.08),rgba(216,195,149,.03));border-color:rgba(255,213,74,.3)}
.pod-step.p2{height:78%;background:rgba(220,220,220,.04);border-color:rgba(220,220,220,.15)}
.pod-step.p3{height:62%;background:rgba(205,127,50,.04);border-color:rgba(205,127,50,.2)}
.pod-step.p1{order:2}.pod-step.p2{order:1;border-right:none}.pod-step.p3{order:3;border-left:none}
.pod-logo-wrap{width:44px;height:44px;border-radius:50%;overflow:hidden;border:2px solid var(--cp-ln);background:var(--cp-dark3);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pod-logo-wrap img{width:100%;height:100%;object-fit:cover}
.pod-num{font-family:'Michroma',sans-serif;font-size:.9rem;font-weight:700;margin-top:.3rem}
.p1 .pod-num{color:#FFD54A}.p2 .pod-num{color:#C0C0C0}.p3 .pod-num{color:#CD7F32}
.pod-name{font-size:.68rem;color:var(--cp-tx);text-align:center;margin-top:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:90px}
.pod-pts{font-size:.62rem;color:var(--cp-gray)}

/* TABLA */
.pg-tabla{width:100%;border-collapse:collapse;font-size:.85rem}
.pg-tabla th{padding:9px 10px;border-bottom:1px solid var(--cp-ln);color:var(--cp-gold);font:.65rem 'Michroma',sans-serif;letter-spacing:.08em;text-transform:uppercase;text-align:left;background:rgba(216,195,149,.04)}
.pg-tabla td{padding:9px 10px;border-bottom:1px solid rgba(216,195,149,.07);vertical-align:middle}
.pg-tabla tr:last-child td{border-bottom:none}
.pg-tabla .top1 td{background:rgba(255,213,74,.06);color:#FFD54A}
.pg-tabla .top2 td{background:rgba(192,192,192,.05);color:#D4D4D4}
.pg-tabla .top3 td{background:rgba(205,127,50,.05);color:#CD9A60}
.eq-logo{width:28px;height:28px;border-radius:50%;object-fit:cover;border:1.5px solid var(--cp-ln);background:var(--cp-dark3);vertical-align:middle;margin-right:6px}
.jugadores{font-size:.72rem;color:var(--cp-gray)}

/* DESCARGAR */
.btn-dl{display:inline-flex;align-items:center;gap:.5rem;padding:.55rem 1.2rem;background:rgba(216,195,149,.08);border:1.5px solid rgba(216,195,149,.3);color:var(--cp-gold);border-radius:5px;font:.72rem 'Michroma',sans-serif;font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:all .15s}
.btn-dl:hover{background:rgba(216,195,149,.16);border-color:var(--cp-gold)}

/* CAPTURABLE */
#res-capture{background:var(--cp-dark2);padding:1.5rem;border-radius:10px;border:1px solid var(--cp-ln)}

/* SPIN */
.spin{display:inline-block;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.pg-loading{text-align:center;padding:3rem;color:var(--cp-gray)}
.pg-empty{text-align:center;padding:3rem;color:var(--cp-gray)}
.pg-empty i{font-size:2.5rem;opacity:.15;display:block;margin-bottom:.6rem;color:var(--cp-gold)}

.pg-footer{border-top:1px solid var(--cp-ln);padding:2rem 1.5rem;text-align:center;color:var(--cp-gray);font-size:.78rem;margin-top:3rem}
.pg-footer a{color:var(--cp-gold-a);transition:color .15s}.pg-footer a:hover{color:var(--cp-gold)}

@media(max-width:640px){
  .rmp-grid{grid-template-columns:1fr}
  .det-grid{grid-template-columns:1fr 1fr}
  .podio{max-width:100%}
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
const P = window.PumasPortal;
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const $  = id => document.getElementById(id);

const JUEGOS = {free_fire:'Free Fire',cod:'Call of Duty',valorant:'Valorant',fortnite:'Fortnite',minecraft:'Minecraft'};
const ESTADO_L = {activo:'Activo',en_juego:'En juego',finalizado:'Finalizado'};

function fmtFecha(iso){if(!iso)return null;return new Date(iso).toLocaleDateString('es',{year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'America/Bogota'});}
function fmtZonas(iso){
  if(!iso)return '';
  const d=new Date(iso);if(isNaN(d))return '';
  const t=tz=>d.toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:tz});
  const fd=tz=>d.toLocaleDateString('es',{day:'2-digit',month:'short',timeZone:tz});
  const dCol=fd('America/Bogota'),dMex=fd('America/Mexico_City'),dArg=fd('America/Argentina/Buenos_Aires');
  const sMex=dMex!==dCol?` ${dMex}`:'',sArg=dArg!==dCol?` ${dArg}`:'';
  return `<span class="tz-tag"><b>COL</b>${t('America/Bogota')}</span>`+
         `<span class="tz-tag"><b>MEX</b>${t('America/Mexico_City')}${sMex}</span>`+
         `<span class="tz-tag"><b>ARG</b>${t('America/Argentina/Buenos_Aires')}${sArg}</span>`;
}

// ── LISTA ────────────────────────────────────────────────────────────
async function cargarLista(){
  try{
    const lista = await P.relampagos.listar();
    if(!lista.length){
      $('rmp-grid').innerHTML='<div class="pg-empty"><i class="fa-solid fa-bolt"></i>No hay relampagos disponibles aún</div>';
      return;
    }
    $('rmp-grid').innerHTML = lista.map(r => `
      <div class="rmp-card" onclick="verDetalle(${r.id})">
        <div class="rmp-banner">${r.banner_url?`<img src="${esc(r.banner_url)}" alt="${esc(r.nombre)}" loading="lazy">`:`<i class='fa-solid fa-bolt' style='font-size:2.5rem;opacity:.15'></i>`}</div>
        <div class="rmp-body">
          <div class="rmp-row">
            ${r.logo_url?`<img src="${esc(r.logo_url)}" alt="" style="width:28px;height:28px;border-radius:50%;object-fit:cover;border:1.5px solid var(--cp-ln)">`:'' }
            <span class="rmp-nombre">${esc(r.nombre)}</span>
          </div>
          <div class="rmp-meta">
            ${r.juego?`<span><i class="fa-solid fa-gamepad"></i> ${JUEGOS[r.juego]||r.juego}</span>`:''}
            ${r.fecha?`<span><i class="fa-regular fa-calendar"></i> ${new Date(r.fecha).toLocaleDateString('es',{day:'2-digit',month:'short',timeZone:'America/Bogota'})} ${new Date(r.fecha).toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'America/Bogota'})} COL</span>`:''}
          </div>
          ${r.premio?`<div class="rmp-prize"><i class="fa-solid fa-trophy" style="font-size:.75rem;margin-right:4px;opacity:.7"></i>${esc(r.premio)}</div>`:''}
        </div>
        <div class="rmp-footer">
          <span class="chip chip-${r.estado}">${ESTADO_L[r.estado]||r.estado}</span>
          <span class="chip ${r.es_gratis?'chip-gratis':'chip-pago'}">${r.es_gratis?'Gratis':'De pago'}</span>
        </div>
      </div>`).join('');
  }catch(e){
    $('rmp-grid').innerHTML='<div class="pg-empty" style="color:#ff8a8d"><i class="fa-solid fa-triangle-exclamation"></i>Error al cargar</div>';
  }
}

// ── DETALLE ──────────────────────────────────────────────────────────
let rmpActual = null;

async function verDetalle(id){
  const params = new URLSearchParams(location.search);
  params.set('id', id);
  history.pushState({id}, '', '?' + params.toString());
  mostrarDetalle(id);
}

function volverLista(){
  history.pushState({}, '', location.pathname);
  $('rmp-lista-view').style.display='';
  $('rmp-det-view').style.display='none';
  document.title='Relampagos | Corp Pumas Gaming';
}

async function mostrarDetalle(id){
  $('rmp-lista-view').style.display='none';
  $('rmp-det-view').style.display='block';
  $('det-nombre').textContent='Cargando…';
  $('det-grid').innerHTML='';
  $('det-contacto').innerHTML='';
  $('det-desc').textContent='';
  $('res-block').style.display='none';
  $('det-banner-wrap').innerHTML='';

  try{
    const r = await P.relampagos.porId(id);
    if(!r){$('det-nombre').textContent='No encontrado';return;}
    rmpActual = r;
    document.title = r.nombre + ' | Corp Pumas Gaming';

    if(r.banner_url) $('det-banner-wrap').innerHTML=`<img src="${esc(r.banner_url)}" alt="${esc(r.nombre)}" class="det-banner">`;
    const logo=$('det-logo');
    if(r.logo_url){logo.src=r.logo_url;logo.style.display='';}else logo.style.display='none';
    $('det-nombre').textContent=r.nombre;
    const estChip=$('det-estado-chip');
    estChip.textContent=ESTADO_L[r.estado]||r.estado;estChip.className='chip chip-'+r.estado;

    const datos=[];
    if(r.juego) datos.push([`<i class='fa-solid fa-gamepad'></i>`,JUEGOS[r.juego]||r.juego,'Juego']);
    if(r.fecha) datos.push([`<i class='fa-regular fa-calendar'></i>`,`${fmtFecha(r.fecha)}<br><span class="tz-row">${fmtZonas(r.fecha)}</span>`,'Fecha']);
    if(r.premio) datos.push([`<i class='fa-solid fa-trophy'></i>`,r.premio,'Premio']);
    datos.push([`<i class='fa-solid fa-ticket'></i>`,r.es_gratis?'Gratuito':`${r.costo||'De pago'}`,'Inscripción']);
    if(r.metodo_pago) datos.push([`<i class='fa-solid fa-credit-card'></i>`,r.metodo_pago,'Método de pago']);

    $('det-grid').innerHTML=datos.map(([ic,val,lbl])=>`
      <div class="det-dato"><label>${lbl}</label><span>${ic} ${esc(val)}</span></div>`).join('');

    if(r.descripcion) $('det-desc').textContent=r.descripcion;

    const contactos=[];
    if(r.org_wa) contactos.push(`<a href="https://wa.me/${r.org_wa.replace(/\D/g,'')}" target="_blank" rel="noopener"><i class='fa-brands fa-whatsapp'></i> WhatsApp</a>`);
    if(r.org_ig) contactos.push(`<a href="https://instagram.com/${r.org_ig.replace('@','')}" target="_blank" rel="noopener"><i class='fa-brands fa-instagram'></i> Instagram</a>`);
    $('det-contacto').innerHTML=contactos.join('');

    if(r.estado==='finalizado'||r.estado==='en_juego'){
      await cargarResultados(r.id);
    }
  }catch(e){
    $('det-nombre').textContent='Error al cargar';
  }
}

async function cargarResultados(id){
  try{
    const eqs = await P.relampagos.equipos(id);
    if(!eqs.length)return;
    $('res-block').style.display='';
    const sorted = [...eqs].sort((a,b)=>{
      if(a.puesto===0&&b.puesto===0)return b.puntos-a.puntos;
      if(a.puesto===0)return 1;if(b.puesto===0)return-1;
      return a.puesto-b.puesto;
    });
    // Podio
    const top=sorted.filter(e=>e.puesto>0&&e.puesto<=3);
    const pod=$('podio-wrap');
    if(top.length>=2){
      pod.style.display='';
      const ICON=['<i class="fa-solid fa-users"></i>','<i class="fa-solid fa-users"></i>','<i class="fa-solid fa-users"></i>'];
      const ORDER=[{p:2,cls:'p2'},{p:1,cls:'p1'},{p:3,cls:'p3'}];
      pod.innerHTML=`<div class="podio">`+ORDER.map(({p,cls})=>{
        const e=top.find(x=>x.puesto===p);
        if(!e)return'';
        return`<div class="pod-step ${cls}">
          <div class="pod-logo-wrap">${e.logo_url?`<img src="${esc(e.logo_url)}" alt="">`:ICON[0]}</div>
          <div class="pod-num">${p}°</div>
          <div class="pod-name">${esc(e.nombre)}</div>
          <div class="pod-pts">${e.puntos} pts · ${e.kills} kills</div>
        </div>`;
      }).join('')+'</div>';
    }else pod.style.display='none';

    // Tabla
    $('res-tbody').innerHTML=sorted.map((e,i)=>{
      const rowCls=e.puesto===1?'top1':e.puesto===2?'top2':e.puesto===3?'top3':'';
      const jugs=[e.jugador1,e.jugador2,e.jugador3,e.jugador4].filter(Boolean);
      return`<tr class="${rowCls}">
        <td style="font-weight:700;width:36px">${e.puesto>0?'#'+e.puesto:'—'}</td>
        <td>${e.logo_url?`<img src="${esc(e.logo_url)}" class="eq-logo" alt="">`:''}${esc(e.nombre)}</td>
        <td style="font-weight:700">${e.puntos}</td>
        <td>${e.kills}</td>
        <td class="jugadores">${esc(jugs.join(' · '))||'—'}</td>
      </tr>`;
    }).join('');
  }catch(e){}
}

async function descargarImagen(){
  const el=$('res-capture');
  if(typeof html2canvas==='undefined'){alert('html2canvas no cargó');return;}
  try{
    const canvas=await html2canvas(el,{backgroundColor:'#141414',scale:2,useCORS:true,logging:false});
    const a=document.createElement('a');
    a.download=(rmpActual?.nombre||'resultados').replace(/\s+/g,'-').toLowerCase()+'-resultados.png';
    a.href=canvas.toDataURL('image/png');a.click();
  }catch(e){alert('Error al generar imagen: '+e.message);}
}

// ── ROUTER ───────────────────────────────────────────────────────────
function init(){
  const id=new URLSearchParams(location.search).get('id');
  if(id) mostrarDetalle(Number(id));
  else cargarLista();
}

window.addEventListener('popstate',e=>{
  const id=new URLSearchParams(location.search).get('id');
  if(id) mostrarDetalle(Number(id));
  else { $('rmp-lista-view').style.display=''; $('rmp-det-view').style.display='none'; document.title='Relampagos | Corp Pumas Gaming'; }
});

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init);
else init();
</script>
